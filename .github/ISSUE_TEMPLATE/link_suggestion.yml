name: Sugerir link
description: Sugira um novo link para o guia
title: "[Sugestão] "
labels:
  - suggestion
body:
  - type: dropdown
    id: section
    attributes:
      label: Seção
      description: Onde este link deveria entrar?
      options:
        - Tema (Alemanha)
        - Cidade
        - Outros
    validations:
      required: true
  - type: input
    id: category_or_city
    attributes:
      label: Tema ou cidade
      placeholder: Ex. housing, legal, stuttgart
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Nome do recurso
      placeholder: Ex. Nome do site/serviço
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Contexto
      description: Explique rapidamente por que este link é útil para brasileiros na Alemanha.
    validations:
      required: false
